name: MicroPython

on:
  workflow_call:
  release:
    types: [created]

jobs:
  package:
    if: github.event_name == 'release'
    uses: ./.github/workflows/script-package.yaml
    secrets: inherit

  build:
    needs: package
    if: always() && (needs.package.result == 'success' || needs.package.result == 'skipped')
    name: MicroPython ${{ matrix.name }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
        - name: pico_w_inky
        - name: pico2_w_inky

    env:
      # Use the release tag for releases and the ref name for tag-triggered workflow calls.
      RELEASE_FILE: ${{ matrix.name }}-${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || github.sha }}-micropython
      CI_PROJECT_ROOT: ${{ github.workspace }}/src-${{ github.sha }}
      CI_BUILD_ROOT: ${{ github.workspace }}
      CI_USE_ENV: 1

    steps:
    - name: Compiler Cache Fixup
      run: |
        mkdir -p /home/runner/.ccache

    - name: "CCache: Restore saved cache"
      uses: actions/cache@v6
      with:
        path: /home/runner/.ccache
        key: ccache-micropython-${{ matrix.name }}-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ccache-micropython-${{ matrix.name }}-${{ github.ref }}
          ccache-micropython-${{ matrix.name }}-

    - name: "CMake build cache: Restore"
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/${{ matrix.name }}
        key: cmake-micropython-${{ matrix.name }}-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          cmake-micropython-${{ matrix.name }}-${{ github.ref }}
          cmake-micropython-${{ matrix.name }}-

    - name: "Python virtualenv cache: Restore"
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.dir2uf2
        key: venv-micropython-${{ hashFiles('**/requirements*.txt') }}

    - name: "Checkout Inky-Frame"
      uses: actions/checkout@v7
      with:
        repository: kruton/inky-frame
        ref: b7df36c3e7dfbd7effde9a642f94985cb2fa6449
        submodules: true
        path: ${{ env.CI_PROJECT_ROOT }}

    - name: "Checkout weather-dash"
      uses: actions/checkout@v7
      with:
        path: ${{ env.CI_PROJECT_ROOT }}/weather-dash

    - name: Download signed script package
      uses: actions/download-artifact@v7
      with:
        name: signed-script-package
        path: ${{ env.CI_PROJECT_ROOT }}/ota-dist

    - name: "Install Arm GNU Toolchain (arm-none-eabi-gcc)"
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '13.3.Rel1'

    - name: "Create Python virtualenv"
      shell: bash
      run: |
        python3 -m venv "$CI_BUILD_ROOT/.dir2uf2"

    - name: "Prepare tools & dependencies"
      shell: bash
      run: |
        source "$CI_BUILD_ROOT/.dir2uf2/bin/activate"
        source "$CI_PROJECT_ROOT/ci/micropython.sh" && ci_debug
        mkdir -p "$CI_BUILD_ROOT"
        ci_apt_install_build_deps
        ci_prepare_all

    - name: Install signed scripts and frozen OTA recovery
      run: |
        source "$CI_BUILD_ROOT/.dir2uf2/bin/activate"
        python3 -m pip install 'cryptography==50.0.2'
        python3 "$CI_PROJECT_ROOT/weather-dash/client/install_ota.py" \
          "$CI_PROJECT_ROOT" "$CI_PROJECT_ROOT/ota-dist"

    - name: "MicroPython: Configure"
      shell: bash
      run: |
        source "$CI_BUILD_ROOT/.dir2uf2/bin/activate"
        source "$CI_PROJECT_ROOT/ci/micropython.sh" && ci_debug
        micropython_version
        ci_cmake_configure ${{ matrix.name }}

    - name: "MicroPython: Build"
      shell: bash
      run: |
        source "$CI_BUILD_ROOT/.dir2uf2/bin/activate"
        source "$CI_PROJECT_ROOT/ci/micropython.sh" && ci_debug
        # ci_genversion overwrites RELEASE_FILE from CI_RELEASE_FILENAME.
        # Have the helper copy directly to the intended artifact names.
        export CI_RELEASE_FILENAME="$RELEASE_FILE"
        ci_cmake_build ${{ matrix.name }}

    - name: "Artifacts: Upload .uf2"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.RELEASE_FILE }}.uf2
        path: ${{ env.CI_BUILD_ROOT }}/${{ env.RELEASE_FILE }}.uf2

    - name: "Artifacts: Upload .uf2 (With Filesystem)"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.RELEASE_FILE }}-with-filesystem.uf2
        path: ${{ env.CI_BUILD_ROOT }}/${{ env.RELEASE_FILE }}-with-filesystem.uf2

    - name: "Release: Upload .uf2"
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ env.CI_BUILD_ROOT }}/${{ env.RELEASE_FILE }}.uf2

    - name: "Release: Upload .uf2 (With Filesystem)"
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        files: ${{ env.CI_BUILD_ROOT }}/${{ env.RELEASE_FILE }}-with-filesystem.uf2
