# Keep this one-day hold aligned with minimumReleaseAge in renovate.json.
minimumReleaseAge: 1440

allowBuilds:
  '@swc/core': true
  esbuild: true

# epdoptimize declares rgbquant through GitHub. Use its published package so
# installs remain locked to the registry and pass pnpm's exotic-subdep policy.
overrides:
  'epdoptimize>rgbquant': 1.1.2
