[project]
name = "weather-dash"
version = "0.1.7"
description = "A dashboard for weather display on an ePaper display."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography==50.0.2",
    "fastapi[standard]==0.143.0",
    "pillow==12.3.0",
    "playwright==1.63.0",
    "prometheus-client==0.26.0",
    "tzdata==2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
hello = "weather_dash:hello"

[tool.uv]
python-downloads = "automatic"

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "fastapi-cli==0.0.32",
    "pytest==9.1.1",
    "httpx==0.28.1",
]
